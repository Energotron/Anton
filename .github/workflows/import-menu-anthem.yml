name: Integrate KR3 MP3 Menu Player

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/import-menu-anthem.yml'
      - '.github/scripts/fetch-menu-mp3.sh'
      - '.github/scripts/integrate-menu-mp3.py'

permissions:
  contents: write

concurrency:
  group: kr3-menu-mp3-integration
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout latest WebGL master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install modern audio downloader
        run: python -m pip install --upgrade 'yt-dlp[default,curl-cffi]'

      - name: Build verified compressed MP3
        shell: bash
        run: |
          set -euo pipefail
          target='game/webgl/music/menu-anthem.mp3'
          if test -s "$target"; then
            duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$target" || true)"
            if test -n "$duration" && awk -v d="$duration" 'BEGIN { exit !(d >= 245.0 && d <= 265.0) }'; then
              echo "Reusing verified repository MP3 (${duration}s)."
              exit 0
            fi
          fi
          bash .github/scripts/fetch-menu-mp3.sh "$target"

      - name: Integrate one menu audio runtime
        run: |
          python .github/scripts/integrate-menu-mp3.py
          rm -f game/webgl/music/menu-anthem.ogg
          rm -f game/webgl/src/menuAudioPlaceholderRuntime.js

      - name: Verify integration and WebGL build
        shell: bash
        run: |
          set -euo pipefail
          test -s game/webgl/music/menu-anthem.mp3
          test ! -e game/webgl/music/menu-anthem.ogg
          test ! -e game/webgl/src/menuAudioPlaceholderRuntime.js
          grep -q "const MENU_ANTHEM = 'music/menu-anthem.mp3';" game/webgl/js/main.js
          grep -Fq 'window.KR3MenuAnthem?.autoplay?.()' game/webgl/js/main.js
          grep -q 'src="src/menuAnthemRuntime.js"' game/webgl/index.html
          grep -q "const LOCAL_SOURCE = 'music/menu-anthem.mp3';" game/webgl/src/menuAnthemRuntime.js
          grep -q 'audio.loop = true;' game/webgl/src/menuAnthemRuntime.js
          ! grep -q 'id="kr3MenuPlayer"' game/webgl/index.html
          ! grep -q 'id="kr3MenuAudio"' game/webgl/index.html
          duration="$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 game/webgl/music/menu-anthem.mp3)"
          awk -v d="$duration" 'BEGIN { exit !(d >= 245.0 && d <= 265.0) }'
          cd game/webgl
          npm install --no-audit --no-fund
          npm test
          npm run build
          mkdir -p dist/music
          cp music/menu-anthem.mp3 dist/music/menu-anthem.mp3
          test -s dist/music/menu-anthem.mp3

      - name: Commit MP3 player to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/webgl/index.html game/webgl/js/main.js game/webgl/music/menu-anthem.mp3
          git rm -f --ignore-unmatch game/webgl/music/menu-anthem.ogg game/webgl/src/menuAudioPlaceholderRuntime.js
          if git diff --cached --quiet; then
            echo 'MP3 menu player is already integrated.'
            exit 0
          fi
          git commit -m 'feat(webgl): add looping MP3 anthem to main menu'
          for attempt in 1 2 3; do
            git pull --rebase origin master
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 3))
          done
          exit 1
