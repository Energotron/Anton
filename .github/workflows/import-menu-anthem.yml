name: Integrate KR3 Children of Eltan Menu Anthem

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/import-menu-anthem.yml'

permissions:
  contents: write

jobs:
  integrate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify supplied KR3 assets
        shell: bash
        run: |
          set -euo pipefail
          test -s game/webgl/music/menu-anthem.ogg
          test -s game/android/app/src/main/res/drawable/kr3_children_of_eltan.webp
          grep -q '@drawable/kr3_children_of_eltan' game/android/app/src/main/AndroidManifest.xml
          ls -lh game/webgl/music/menu-anthem.ogg game/android/app/src/main/res/drawable/kr3_children_of_eltan.webp

      - name: Wire За краем орбит to the main menu
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('game/webgl/js/main.js')
          s = p.read_text(encoding='utf-8')

          # Normalize any previous draft path to the bundled Ogg asset.
          s = s.replace("const MENU_ANTHEM = 'music/menu-anthem.mp3';", "const MENU_ANTHEM = 'music/menu-anthem.ogg';")

          if "const MENU_ANTHEM = 'music/menu-anthem.ogg';" not in s:
              needle = "const MUSIC_TRACKS = ["
              if needle not in s:
                  raise SystemExit('MUSIC_TRACKS anchor not found')
              s = s.replace(needle, "const MENU_ANTHEM = 'music/menu-anthem.ogg';\n" + needle, 1)

          if 'function startMenuMusic() {' not in s:
              needle = "function startMusic() {"
              block = r'''function startMenuMusic() {
            stopMusic();
            if (muted || !musicOn) return;
            initAudio();
            musicGen++;
            const gen = musicGen;
            const a = new Audio(MENU_ANTHEM);
            a.loop = true;
            a.volume = 0.46;
            musicAudio = a;
            a.onerror = () => {
              if (gen !== musicGen) return;
              musicAudio = null;
            };
            a.play().catch(() => {
              if (gen !== musicGen) return;
              const resume = () => {
                if (gen !== musicGen || muted || !musicOn || G.state !== 'menu') return;
                a.play().catch(() => {});
              };
              document.addEventListener('pointerdown', resume, { once: true });
              document.addEventListener('keydown', resume, { once: true });
            });
          }

          '''
              if needle not in s:
                  raise SystemExit('startMusic anchor not found')
              s = s.replace(needle, block + needle, 1)

          # Returning from the game to menu restores the anthem.
          s = s.replace("stopMusic(); G.state = 'menu';", "G.state = 'menu'; startMenuMusic();", 1)

          # The music toggle knows which soundtrack belongs to which state.
          old = "  if (muted) stopMusic();\n  else if (musicOn && (G.state === 'demo' || G.state === 'game')) startMusic();"
          new = "  if (muted) stopMusic();\n  else if (musicOn && G.state === 'menu') startMenuMusic();\n  else if (musicOn && (G.state === 'demo' || G.state === 'game')) startMusic();"
          if old in s:
              s = s.replace(old, new, 1)

          # Start the anthem on the initial menu. Android WebView is configured
          # to allow media playback without requiring a user gesture; browsers
          # that still block autoplay resume on the first pointer/key event.
          startup_old = "requestAnimationFrame(frame);\nR.render();\nconsole.log('%cКР3 WebGL"
          startup_new = "requestAnimationFrame(frame);\nR.render();\nstartMenuMusic();\nconsole.log('%cКР3 WebGL"
          if 'R.render();\nstartMenuMusic();\nconsole.log' not in s:
              if startup_old not in s:
                  raise SystemExit('startup anchor not found')
              s = s.replace(startup_old, startup_new, 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify menu music integration
        shell: bash
        run: |
          set -euo pipefail
          grep -q "const MENU_ANTHEM = 'music/menu-anthem.ogg';" game/webgl/js/main.js
          grep -q 'function startMenuMusic()' game/webgl/js/main.js
          grep -q 'startMenuMusic();' game/webgl/js/main.js
          grep -q '@drawable/kr3_children_of_eltan' game/android/app/src/main/AndroidManifest.xml

      - name: Commit menu integration to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/webgl/js/main.js
          if ! git diff --cached --quiet; then
            git commit -m 'feat(audio): play За краем орбит in KR3 main menu'
            for attempt in 1 2 3; do
              if git push origin HEAD:master; then
                break
              fi
              echo "Push attempt $attempt failed; rebasing on master..."
              git pull --rebase origin master
            done
          else
            echo 'Main-menu anthem code is already integrated.'
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install WebGL dependencies
        working-directory: game/webgl
        run: npm install --no-audit --no-fund

      - name: Build WebGL game
        working-directory: game/webgl
        run: npm run build

      - name: Ensure anthem is in WebGL dist
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p game/webgl/dist/music
          cp game/webgl/music/menu-anthem.ogg game/webgl/dist/music/menu-anthem.ogg
          test -s game/webgl/dist/music/menu-anthem.ogg

      - name: Bundle game into Android assets
        run: |
          rm -rf game/android/app/src/main/assets/www
          mkdir -p game/android/app/src/main/assets/www
          cp -R game/webgl/dist/. game/android/app/src/main/assets/www/
          test -s game/android/app/src/main/assets/www/music/menu-anthem.ogg

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -path '*/cmdline-tools/*/bin/sdkmanager' | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: game/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p artifacts
          cp game/android/app/build/outputs/apk/debug/app-debug.apk artifacts/KR3-Children-of-Eltan-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KR3-Children-of-Eltan-Android-debug-apk
          path: artifacts/KR3-Children-of-Eltan-debug.apk
          if-no-files-found: error
          retention-days: 30
