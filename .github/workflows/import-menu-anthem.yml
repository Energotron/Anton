name: Integrate KR3 MP3 Menu Player

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/import-menu-anthem.yml'

permissions:
  contents: write

concurrency:
  group: kr3-menu-mp3-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout latest WebGL master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install audio downloader
        run: python -m pip install --upgrade yt-dlp

      - name: Build verified compressed MP3
        run: bash .github/scripts/fetch-menu-mp3.sh game/webgl/music/menu-anthem.mp3

      - name: Integrate player with existing WebGL audio engine
        run: |
          python .github/scripts/integrate-menu-mp3.py
          rm -f game/webgl/music/menu-anthem.ogg

      - name: Verify integration and WebGL build
        shell: bash
        run: |
          set -euo pipefail
          test -s game/webgl/music/menu-anthem.mp3
          test ! -e game/webgl/music/menu-anthem.ogg
          grep -q "const MENU_ANTHEM = 'music/menu-anthem.mp3';" game/webgl/js/main.js
          grep -q "document.getElementById('kr3MenuAudio')" game/webgl/js/main.js
          grep -q 'id="kr3MenuPlayer"' game/webgl/index.html
          grep -q 'src="music/menu-anthem.mp3"' game/webgl/index.html
          cd game/webgl
          npm install --no-audit --no-fund
          npm test
          npm run build
          mkdir -p dist/music
          cp music/menu-anthem.mp3 dist/music/menu-anthem.mp3
          test -s dist/music/menu-anthem.mp3

      - name: Commit MP3 player to master
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add game/webgl/index.html game/webgl/js/main.js game/webgl/music/menu-anthem.mp3
          git rm -f --ignore-unmatch game/webgl/music/menu-anthem.ogg
          if git diff --cached --quiet; then
            echo 'MP3 menu player is already integrated.'
            exit 0
          fi
          git commit -m 'feat(webgl): add compressed MP3 anthem player to main menu'
          for attempt in 1 2 3; do
            git pull --rebase origin master
            if git push origin HEAD:master; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying..."
            sleep $((attempt * 3))
          done
          exit 1
