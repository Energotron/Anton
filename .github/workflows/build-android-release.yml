name: Build KR3 Android Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install WebGL dependencies
        working-directory: game/webgl
        run: npm install --no-audit --no-fund

      - name: Build WebGL game
        working-directory: game/webgl
        run: npm run build

      - name: Bundle game into Android assets
        run: |
          rm -rf game/android/app/src/main/assets/www
          mkdir -p game/android/app/src/main/assets/www
          cp -R game/webgl/dist/. game/android/app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 16 platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -path '*/cmdline-tools/*/bin/sdkmanager' | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Install Gradle 8.13
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Restore release keystore
        shell: bash
        env:
          KR3_KEYSTORE_BASE64: ${{ secrets.KR3_KEYSTORE_BASE64 }}
        run: |
          test -n "$KR3_KEYSTORE_BASE64"
          printf '%s' "$KR3_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kr3-release.jks"

      - name: Build signed release APK and AAB
        working-directory: game/android
        env:
          KR3_KEYSTORE_PATH: ${{ runner.temp }}/kr3-release.jks
          KR3_KEYSTORE_PASSWORD: ${{ secrets.KR3_KEYSTORE_PASSWORD }}
          KR3_KEY_ALIAS: ${{ secrets.KR3_KEY_ALIAS }}
          KR3_KEY_PASSWORD: ${{ secrets.KR3_KEY_PASSWORD }}
        run: |
          gradle :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Stage release artifacts
        run: |
          mkdir -p artifacts
          cp game/android/app/build/outputs/apk/release/app-release.apk artifacts/KR3-release.apk
          cp game/android/app/build/outputs/bundle/release/app-release.aab artifacts/KR3-release.aab

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KR3-Android-release
          path: |
            artifacts/KR3-release.apk
            artifacts/KR3-release.aab
          if-no-files-found: error
          retention-days: 30
