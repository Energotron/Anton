name: KR3 Runtime Health

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate runtime and data
        shell: bash
        run: |
          set -euo pipefail
          test -s game/webgl/index.html
          test -s game/webgl/js/main.js
          test -s game/webgl/js/WebGLRenderer.js
          python3 -m json.tool data/diplomacy_rules.json >/dev/null
          python3 -m json.tool game/webgl/manifest.json >/dev/null
          for track in flight fighter human gaal fei quasar peleng maloc; do
            test -s "game/webgl/music/${track}.mp3"
          done

      - name: Install WebGL dependencies
        run: npm install --prefix game/webgl --no-audit --no-fund --package-lock=false

      - name: Run gameplay tests
        run: npm test --prefix game/webgl

      - name: Build production WebGL bundle
        run: npm run build --prefix game/webgl

      - name: Check repository stayed clean
        shell: bash
        run: |
          git status --short
          test -z "$(git status --porcelain)" || {
            echo 'Health check modified tracked files; refusing silent drift.' >&2
            exit 1
          }
