name: Build KR3 Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'game/webgl/**'
      - 'game/android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install WebGL dependencies
        working-directory: game/webgl
        run: npm install --no-audit --no-fund

      - name: Build WebGL game
        working-directory: game/webgl
        run: npm run build

      - name: Bundle game into Android assets
        run: |
          rm -rf game/android/app/src/main/assets/www
          mkdir -p game/android/app/src/main/assets/www
          cp -R game/webgl/dist/. game/android/app/src/main/assets/www/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: game/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p artifacts
          cp game/android/app/build/outputs/apk/debug/app-debug.apk artifacts/KR3-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KR3-Android-debug-apk
          path: artifacts/KR3-debug.apk
          if-no-files-found: error
          retention-days: 30
