name: Build KR3 Android APK

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'game/webgl/**'
      - 'game/android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore v0.4.1 menu anthem from staged chunks
        shell: bash
        run: |
          set -euo pipefail
          cat .github/anthem-hotfix6k/part000.b64 \
              .github/anthem-hotfix6k/part001.b64 \
              .github/anthem-hotfix6k/part002.b64 \
              .github/anthem-hotfix2k/part003.b64 \
            | tr -d '\r\n' | base64 -d > game/webgl/music/menu-anthem.ogg
          test -s game/webgl/music/menu-anthem.ogg
          test "$(wc -c < game/webgl/music/menu-anthem.ogg)" -gt 50000
          test "$(head -c 4 game/webgl/music/menu-anthem.ogg)" = "OggS"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install WebGL dependencies
        working-directory: game/webgl
        run: npm install --no-audit --no-fund

      - name: Build WebGL game
        working-directory: game/webgl
        run: npm run build

      - name: Bundle game into Android assets
        run: |
          rm -rf game/android/app/src/main/assets/www
          mkdir -p game/android/app/src/main/assets/www
          cp -R game/webgl/dist/. game/android/app/src/main/assets/www/
          mkdir -p game/android/app/src/main/assets/www/music
          cp -a game/webgl/music/. game/android/app/src/main/assets/www/music/
          test -s game/android/app/src/main/assets/www/music/menu-anthem.ogg

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 platform
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -path '*/cmdline-tools/*/bin/sdkmanager' | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        shell: bash
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        working-directory: game/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p artifacts
          cp game/android/app/build/outputs/apk/debug/app-debug.apk artifacts/KR3-v0.4.1-alpha-hotfix.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: KR3-v0.4.1-alpha-hotfix-apk
          path: artifacts/KR3-v0.4.1-alpha-hotfix.apk
          if-no-files-found: error
          retention-days: 30
