name: Agent Release Promotion

on:
  push:
    branches: [master]
    paths:
      - '.github/release-decision.json'
      - '.github/workflows/create-kr3-release.yml'
      - 'game/webgl/**'
      - 'game/android/**'
      - 'docs/ROADMAP.md'
  workflow_dispatch:

concurrency:
  group: kr3-release-promotion
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  evaluate:
    name: Evaluate agent release decision
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.intent.outputs.release }}
      tag: ${{ steps.intent.outputs.tag }}
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Validate release intent
        id: intent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          data = json.loads(Path('.github/release-decision.json').read_text(encoding='utf-8'))
          required = {'release', 'tag', 'title', 'prerelease', 'reason', 'notes'}
          missing = required - data.keys()
          if missing:
              raise SystemExit(f'missing release-decision keys: {sorted(missing)}')
          if not isinstance(data['release'], bool):
              raise SystemExit('release must be boolean')
          if not isinstance(data['prerelease'], bool):
              raise SystemExit('prerelease must be boolean')
          if not isinstance(data['notes'], list) or not all(isinstance(x, str) for x in data['notes']):
              raise SystemExit('notes must be an array of strings')
          if data['release']:
              if not re.fullmatch(r'v\d+\.\d+\.\d+(?:[-.][0-9A-Za-z.-]+)?', data['tag']):
                  raise SystemExit(f"invalid release tag: {data['tag']!r}")
              if not str(data['title']).strip():
                  raise SystemExit('title is required for a release')
              if len(str(data['reason']).strip()) < 12:
                  raise SystemExit('release reason is too short')
          PY
          RELEASE=$(python3 -c "import json; print(str(json.load(open('.github/release-decision.json'))['release']).lower())")
          TAG=$(python3 -c "import json; print(json.load(open('.github/release-decision.json'))['tag'])")
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Explain no-release decision
        if: steps.intent.outputs.release != 'true'
        run: echo 'Current master is not marked for release.'

  promote:
    name: Verify and publish KR3 release
    needs: evaluate
    if: needs.evaluate.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact master revision
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Guard against duplicate or empty promotion
        id: guard
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.evaluate.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo 'skip=false' >> "$GITHUB_OUTPUT"
          if [ -n "$LATEST" ] && git rev-parse "$LATEST^{commit}" >/dev/null 2>&1; then
            test "$(git rev-list --count "$LATEST..HEAD")" -ge 1
          fi

      - name: Setup Node.js
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install WebGL dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm install --prefix game/webgl --no-audit --no-fund --package-lock=false

      - name: Run gameplay tests
        if: steps.guard.outputs.skip != 'true'
        run: npm test --prefix game/webgl

      - name: Check runtime JavaScript syntax
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find game/webgl/js game/webgl/src -type f -name '*.js' -print0)

      - name: Build production WebGL bundle
        if: steps.guard.outputs.skip != 'true'
        run: npm run build --prefix game/webgl

      - name: Assemble and verify portable runtime
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p game/webgl/dist/music
          cp -a game/webgl/music/. game/webgl/dist/music/
          test -s game/webgl/dist/index.html
          test -d game/webgl/dist/assets
          test -s "game/webgl/dist/music/Песня за краем орбит by космические рейнджеры 2 .mp3"
          for track in flight fighter human gaal fei quasar peleng maloc; do
            test -s "game/webgl/dist/music/${track}.mp3"
          done
          if grep -Eq '(src|href)="/assets/' game/webgl/dist/index.html; then
            echo 'Production index contains root-absolute /assets URLs.' >&2
            exit 1
          fi

      - name: Package verified WebGL game
        if: steps.guard.outputs.skip != 'true'
        id: package
        shell: bash
        env:
          TAG: ${{ needs.evaluate.outputs.tag }}
        run: |
          set -euo pipefail
          SAFE_TAG="${TAG//\//-}"
          ARCHIVE="Space-Rangers-3-Children-of-Eltan-WebGL-${SAFE_TAG}.zip"
          (cd game/webgl/dist && zip -r "$GITHUB_WORKSPACE/$ARCHIVE" .)
          unzip -tq "$ARCHIVE"
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Bundle WebGL game into Android assets
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf game/android/app/src/main/assets/www
          mkdir -p game/android/app/src/main/assets/www
          cp -R game/webgl/dist/. game/android/app/src/main/assets/www/

      - name: Set up JDK 17
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 platform
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -type f -path '*/cmdline-tools/*/bin/sdkmanager' | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Build Android alpha APK
        if: steps.guard.outputs.skip != 'true'
        working-directory: game/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Stage Android APK
        if: steps.guard.outputs.skip != 'true'
        id: android
        shell: bash
        env:
          TAG: ${{ needs.evaluate.outputs.tag }}
        run: |
          set -euo pipefail
          SAFE_TAG="${TAG//\//-}"
          APK="Space-Rangers-3-Children-of-Eltan-Android-${SAFE_TAG}.apk"
          cp game/android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          test -s "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          LATEST: ${{ steps.guard.outputs.latest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          data = json.loads(Path('.github/release-decision.json').read_text(encoding='utf-8'))
          lines = [f"## {data['reason'].strip()}", '']
          notes = [x.strip() for x in data['notes'] if x.strip()]
          if notes:
              lines += ['### Highlights'] + [f'- {x}' for x in notes] + ['']
          lines += [
              '### Downloads',
              '- Android: install the `.apk` asset.',
              '- PC/WebGL: download the WebGL `.zip` and open it with a local web server.',
              '',
              'This is an alpha/pre-release build.',
              ''
          ]
          latest = os.environ.get('LATEST', '').strip()
          if latest:
              try:
                  log = subprocess.check_output(['git', 'log', '--pretty=- %s', f'{latest}..HEAD'], text=True).strip()
              except Exception:
                  log = ''
              if log:
                  lines += ['### Commits since previous release', log, '']
          lines += [f"Build commit: `{subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip()}`"]
          Path('/tmp/release-notes.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Publish new GitHub Release
        if: steps.guard.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.evaluate.outputs.tag }}
          ARCHIVE: ${{ steps.package.outputs.archive }}
          APK: ${{ steps.android.outputs.apk }}
        run: |
          set -euo pipefail
          TITLE=$(python3 -c "import json; print(json.load(open('.github/release-decision.json'))['title'])")
          PRERELEASE=$(python3 -c "import json; print(str(json.load(open('.github/release-decision.json'))['prerelease']).lower())")
          ARGS=(release create "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" "$APK" "$APK.sha256" --target "$GITHUB_SHA" --title "$TITLE $TAG" --notes-file /tmp/release-notes.md)
          if [ "$PRERELEASE" = 'true' ]; then
            ARGS+=(--prerelease)
          fi
          gh "${ARGS[@]}"
