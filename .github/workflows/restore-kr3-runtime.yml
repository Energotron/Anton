name: Restore KR3 WebGL Runtime

# Trigger refresh: restore verified runtime into master.
on:
  push:
    branches: [master]
    paths: ['.github/workflows/restore-kr3-runtime.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Download and verify current reference runtime
        env:
          SR3_DIRECT_URL: 'https://uc34adb11bb510a9069492b52c78.dl.dropboxusercontent.com/cd/0/get/DHPG5hV8ccKEWFhkM6TG-ZZ8zdvCUeFaEXkhX1uyK98lFYk7qeQ6MxFO9l0dYb2f4hYqjCizjBqVGjqzTJsq1h5wfSLV5ur1SJ-_oxrjHm17wPSyLdjhBpcq2wpVNFt9BfuZdRISAYwnjBTnIeKQ6wGM4-oDSyq8w_7L_zmjUEG4mQ/file?c_luid=42f764de'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error "$SR3_DIRECT_URL" -o /tmp/sr3.zip
          unzip -tq /tmp/sr3.zip
          rm -rf /tmp/sr3 && mkdir -p /tmp/sr3
          unzip -q /tmp/sr3.zip -d /tmp/sr3

          candidate="$(find /tmp/sr3 -type f -path '*/js/main.js' -print -quit)"
          test -n "$candidate"
          ROOT="${candidate%/js/main.js}"

          for rel in index.html css/style.css js/main.js js/WebGLRenderer.js js/assets.js js/data.js js/math.js manifest.json; do
            test -f "$ROOT/$rel" || { echo "Missing required runtime file: $rel" >&2; exit 1; }
          done

          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          echo 'Reference runtime archive is structurally valid.'

      - name: Restore runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf game/webgl/css game/webgl/js game/webgl/public
          cp -R "$ROOT/css" game/webgl/css
          cp -R "$ROOT/js" game/webgl/js
          cp "$ROOT/index.html" game/webgl/index.html
          cp "$ROOT/manifest.json" game/webgl/manifest.json
          [ ! -d "$ROOT/public" ] || cp -R "$ROOT/public" game/webgl/public
          mkdir -p game/webgl/music
          cat > game/webgl/music/README.md <<'DOC'
          # Music assets

          Soundtrack MP3 files from the reference archive are intentionally not redistributed in this public repository. The runtime falls back to built-in procedural ambient when they are absent.
          DOC

      - name: Quality gate
        shell: bash
        run: |
          set -euo pipefail
          node --check game/webgl/js/main.js
          node --check game/webgl/js/WebGLRenderer.js
          node --check game/webgl/js/assets.js
          node --check game/webgl/js/data.js
          node --check game/webgl/js/math.js
          npm test --prefix game/webgl
          test -s game/webgl/index.html
          test -s game/webgl/manifest.json
          echo 'Runtime quality gate passed.'

      - name: Commit restored runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/kr3-runtime-bootstrap.zip .github/workflows/restore-kr3-runtime.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A game/webgl .github
          git diff --cached --quiet && exit 0
          git commit -m 'feat: restore SR3 WebGL runtime'
          git push origin HEAD:master
