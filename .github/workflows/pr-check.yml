name: PR Check

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate project structure and data
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/AGENT_DEVELOPMENT_LOOP.md
          test -f docs/PROJECT_CONSTITUTION.md
          test -f docs/ROADMAP.md
          test -f game/webgl/index.html
          test -f game/webgl/js/main.js
          test -f game/webgl/package.json
          python3 -m json.tool data/diplomacy_rules.json >/dev/null
          python3 -m json.tool game/webgl/manifest.json >/dev/null

      - name: Install WebGL dependencies
        run: npm install --prefix game/webgl --no-audit --no-fund --package-lock=false

      - name: Run gameplay tests
        run: npm test --prefix game/webgl

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find game/webgl/src game/webgl/js -type f -name '*.js' -print0)

      - name: Build production WebGL bundle
        run: npm run build --prefix game/webgl
