name: Validate & Build SR3 WebGL

on:
  push:
    branches: [master]
    paths:
      - 'game/webgl/**'
      - '.github/workflows/integrate-sr3-webgl.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-webgl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify full runtime layout
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            game/webgl/index.html \
            game/webgl/css/style.css \
            game/webgl/js/main.js \
            game/webgl/js/WebGLRenderer.js \
            game/webgl/js/assets.js \
            game/webgl/js/data.js \
            game/webgl/js/math.js \
            game/webgl/manifest.json \
            game/webgl/vite.config.js; do
            test -s "$file"
          done
          for track in flight fighter human gaal fei quasar peleng maloc; do
            test -s "game/webgl/music/${track}.mp3"
          done

      - name: Install WebGL dependencies
        run: npm install --prefix game/webgl --no-audit --no-fund --package-lock=false

      - name: Run gameplay tests
        run: npm test --prefix game/webgl

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            node --check "$file"
            count=$((count + 1))
          done < <(find game/webgl/src game/webgl/js -type f -name '*.js' -print0)
          echo "Validated ${count} JavaScript files."

      - name: Build production WebGL bundle
        run: npm run build --prefix game/webgl

      - name: Assemble portable browser build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p game/webgl/dist/music
          cp -a game/webgl/music/. game/webgl/dist/music/

          test -s game/webgl/dist/index.html
          test -d game/webgl/dist/assets
          for track in flight fighter human gaal fei quasar peleng maloc; do
            test -s "game/webgl/dist/music/${track}.mp3"
          done

          # Production must be portable under nested paths / GitHub Pages / local static hosting.
          if grep -Eq '(src|href)="/assets/' game/webgl/dist/index.html; then
            echo 'Production index contains root-absolute /assets URLs.' >&2
            exit 1
          fi

          # Browser build must not depend on unresolved source imports.
          if grep -RIEq "from ['\"]three['\"]|import[[:space:]]*\(['\"]three['\"]\)" game/webgl/dist/assets; then
            echo 'Production bundle still contains a bare three import.' >&2
            exit 1
          fi
          if grep -Eq 'src="[^\"]*(js/main|src/)' game/webgl/dist/index.html; then
            echo 'Production index still points at raw KR3 source modules.' >&2
            exit 1
          fi

      - name: Upload verified browser build
        uses: actions/upload-artifact@v4
        with:
          name: sr3-webgl-${{ github.sha }}
          path: game/webgl/dist
          if-no-files-found: error
          retention-days: 7
