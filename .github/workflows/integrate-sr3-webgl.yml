name: Validate SR3 WebGL

on:
  push:
    branches:
      - master
      - agent/kr3-dev
    paths:
      - 'game/webgl/**'
      - '.github/workflows/integrate-sr3-webgl.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run quest system tests
        run: npm test --prefix game/webgl
      - name: Check JavaScript syntax
        shell: bash
        run: |
          files=()
          while IFS= read -r -d '' file; do files+=("$file"); done < <(
            find game/webgl/src game/webgl/js -type f -name '*.js' -print0 2>/dev/null || true
          )
          for file in "${files[@]}"; do
            node --check "$file"
          done
          echo "Validated ${#files[@]} JavaScript source files."
