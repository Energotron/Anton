    <ellipse rx="360" ry="72" fill="none" stroke="#78b7d8" stroke-width="12" opacity=".38" transform="rotate(-12)"/>
    <ellipse rx="365" ry="78" fill="none" stroke="#c7e9f8" stroke-width="3" opacity=".3" transform="rotate(-12)"/>
  </g>
  <path d="M280 825C505 758 706 685 1015 568" fill="none" stroke="url(#trail)" stroke-width="14" opacity=".72" filter="url(#glow)"/>
  <g transform="translate(1018 566) rotate(-23)">
