      <circle cx="45" cy="130" r="1" fill="#83bfff" opacity=".66"/>
      <circle cx="104" cy="154" r="1.2" fill="#fff" opacity=".7"/>
      <circle cx="171" cy="165" r=".7" fill="#fff" opacity=".8"/>
    </pattern>
