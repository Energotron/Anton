  <rect width="1920" height="1080" fill="url(#space)"/>
  <ellipse cx="1380" cy="230" rx="680" ry="410" fill="url(#nebulaA)" filter="url(#blur80)"/>
  <ellipse cx="310" cy="850" rx="650" ry="380" fill="url(#nebulaB)" filter="url(#blur80)"/>
