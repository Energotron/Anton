<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-label="Космический фон главного меню КР3" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="space" cx="58%" cy="30%" r="78%">
      <stop offset="0" stop-color="#173a66"/>
      <stop offset=".34" stop-color="#0a1930"/>
      <stop offset=".7" stop-color="#050a18"/>
      <stop offset="1" stop-color="#01030a"/>
    </radialGradient>
    <radialGradient id="nebulaA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7147bb" stop-opacity=".52"/>
      <stop offset=".45" stop-color="#304fa2" stop-opacity=".24"/>
      <stop offset="1" stop-color="#182743" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d06a31" stop-opacity=".34"/>
      <stop offset=".45" stop-color="#7d3144" stop-opacity=".18"/>
      <stop offset="1" stop-color="#1a1427" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planet" cx="35%" cy="28%" r="70%">
