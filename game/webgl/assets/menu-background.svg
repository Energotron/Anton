    </radialGradient>
    <linearGradient id="ship" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9f5d0"/>
      <stop offset=".45" stop-color="#d4a84d"/>
      <stop offset="1" stop-color="#4b2d17"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58c8ff" stop-opacity="0"/>
      <stop offset=".6" stop-color="#58c8ff" stop-opacity=".52"/>
      <stop offset="1" stop-color="#e5fbff" stop-opacity=".9"/>
    </linearGradient>
    <filter id="blur80"><feGaussianBlur stdDeviation="80"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="stars" width="180" height="180" patternUnits="userSpaceOnUse">
      <circle cx="18" cy="26" r="1.4" fill="#fff" opacity=".84"/>
