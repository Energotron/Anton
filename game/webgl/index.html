<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<meta name="description" content="Космические Рейнджеры 3 — WebGL pseudo-3D">
<meta name="application-name" content="КР3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="КР3">
<meta name="format-detection" content="telephone=no">
<meta name="screen-orientation" content="landscape">
<title>Космические Рейнджеры 3 — WebGL</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icons/kr3-icon.svg" type="image/svg+xml">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/russo-one@5.0.20/index.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/exo-2@5.0.43/400.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fontsource/exo-2@5.0.43/700.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/app-shell.css">
<!-- Load the import-map polyfill synchronously. On affected Android/WebView builds,
     an async shim can lose the race to the module graph and main.js never executes. -->
<script src="https://ga.jspm.io/npm:es-module-shims@2.8.4/dist/es-module-shims.js"></script>
<script>
  window.addEventListener('error', function (event) {
    if (window.startNewGame) return;
    var box = document.getElementById('errBox');
    if (!box) return;
    var detail = event && (event.message || (event.error && event.error.message));
    if (detail) {
      box.style.display = 'block';
      box.textContent = 'Ошибка загрузки ядра: ' + detail;
    }
  }, true);
</script>
</head>
<body>
  <div id="app">
    <canvas id="cv"></canvas>
    <div id="errBox"></div>

    <div id="hud" class="hidden">
      <div id="tl">
        <div id="sysName">—</div>
        <div id="dayRank">—</div>
        <div class="barWrap"><span class="barLbl">Корпус</span><div class="bar hull"><i id="barHull"></i></div></div>
        <div class="barWrap"><span class="barLbl">Щит</span><div class="bar shield"><i id="barShield"></i></div></div>
        <div id="res"></div>
      </div>
      <div id="tr">
        <canvas id="mm" width="264" height="264"></canvas>
        <div id="trBtns"><button id="sndBtn" title="Выключить звук" aria-label="Звук включён. Нажмите, чтобы выключить.">🔊</button><button id="menuBtn">☰</button></div>
      </div>
      <div id="phase">—</div>
      <div id="questLog"></div>
      <div id="ctx"></div>
    </div>
    <div id="toasts"></div>

    <div id="tbtns" class="hidden">
      <button id="bWait">ЖДУ</button>
      <button id="bMis">РАКЕТА</button>
      <button id="bTurn">ХОД ▶</button>
    </div>
    <button id="galClose" class="btn hidden">✕ Закрыть (Esc)</button>
    <div id="panel" class="hidden"></div>

    <div id="menu">
      <div id="menuBg"></div>
      <div id="menuInner">
        <h1>КОСМИЧЕСКИЕ<br>РЕЙНДЖЕРЫ 3</h1>
        <div class="sub">WebGL · pseudo-3D · свободный полёт<br>станции · астероиды · шлейфы · корабли</div>
        <button class="mbtn" id="btnNewGame" type="button">▶ НОВАЯ ИГРА</button>
        <button class="mbtn" id="contBtn" style="display:none">💾 ПРОДОЛЖИТЬ</button>
        <button class="mbtn ghost" id="btnHelp">🎮 КАК ИГРАТЬ</button>
        <div class="ver">v3.9 · камера · 5 слотов сейвов · инфоцентр · спавн с планет</div>
      </div>
    </div>
    <div id="rotHint" class="hidden">🔄 Переверните телефон горизонтально</div>
  </div>

  <!-- Three.js import map. es-module-shims is fully installed before this graph starts. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
      "./js/WebGLRenderer.js": "./src/safeWebGLRenderer.js"
    }
  }
  </script>
  <!-- App/PWA runtime is loaded first so install/fullscreen lifecycle is ready immediately. -->
  <script type="module" src="src/pwaRuntime.js"></script>
  <!-- Runtime guards must load before main.js so browser audio/save APIs are wrapped safely. -->
  <script type="module" src="src/audioRuntimeGuard.js"></script>
  <script type="module" src="src/saveSlotsRuntime.js"></script>
  <script type="module" src="src/campaignDateRuntime.js"></script>
  <script type="module" src="src/salvageRuntime.js"></script>
  <script type="module" src="src/salvageRadarRuntime.js"></script>
  <script type="module" src="src/pirateBountyRuntime.js"></script>
  <!-- Точка входа — отдельный JS-файл -->
  <script type="module" src="js/main.js"></script>
  <script type="module" src="src/menuAnthemRuntime.js"></script>
  <script type="module" src="src/menuNavigationRuntime.js"></script>
  <script type="module" src="src/cameraTouchRuntime.js"></script>
  <script type="module" src="src/cameraBoundsRuntime.js"></script>
  <script type="module" src="src/landingSceneRuntime.js"></script>
  <script type="module" src="src/modalEscapeRuntime.js"></script>
  <script type="module" src="src/careerHistory.js"></script>
  <script type="module" src="src/reputationIntel.js"></script>
  <script type="module" src="src/contractReputationGate.js"></script>
  <script type="module" src="src/contractOutcomeRuntime.js"></script>
  <script type="module" src="src/contractAbandonRuntime.js"></script>
  <script type="module" src="src/factionDiplomacyRuntime.js"></script>
  <script type="module" src="src/shipBonusRuntime.js"></script>
  <script type="module" src="src/contextualTooltipsRuntime.js"></script>
  <script type="module" src="src/shipCommsRuntime.js"></script>
  <script type="module" src="src/patrolThreatIntelRuntime.js"></script>
  <script type="module" src="src/traderMarketIntelRuntime.js"></script>
</body>
</html>
