<script>
'use strict';
/* ---------- вывод ошибок вместо чёрного экрана ---------- */
function showErr(m){try{const b=document.getElementById('errBox');b.style.display='block';b.textContent='Ошибка: '+m;}catch(e){}}
window.addEventListener('error',function(e){showErr(e.message||'unknown');});

/* ---------- утилиты ---------- */
const TAU=Math.PI*2,DPR=Math.min(2,window.devicePixelRatio||1);
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const mmC=document.getElementById('mm'),mctx=mmC.getContext('2d');
let W=innerWidth,H=innerHeight;
function resize(){W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();
function $(id){return document.getElementById(id);}
function rnd(a,b){return a+Math.random()*(b-a);}
function rndi(a,b){return Math.floor(rnd(a,b+1));}
function pick(a){return (a&&a.length)?a[Math.floor(Math.random()*a.length)]:null;}
function clamp(v,a,b){return v<a?a:(v>b?b:v);}
function dist(x1,y1,x2,y2){return Math.hypot(x2-x1,y2-y1);}
function fmt(n){return Math.round(n).toLocaleString('ru-RU');}
function mulberry(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function easeIO(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

/* ---------- безопасный localStorage ---------- */
const lsMem={};
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return lsMem[k]||null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){lsMem[k]=v;}}

/* ---------- звук ---------- */
let AC=null,muted=false;
function initAudio(){try{if(!AC){AC=new (window.AudioContext||window.webkitAudioContext)();}if(AC&&AC.state==='suspended')AC.resume();}catch(e){}}
function tone(f,d,type,v,slide){try{if(!AC||muted)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(slide,AC.currentTime+d);g.gain.value=v||0.08;g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
function noiseS(d,v,f){try{if(!AC||muted)return;const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),ch=b.getChannelData(0);for(let i=0;i<n;i++)ch[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource();s.buffer=b;const g=AC.createGain();g.gain.value=v;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=f||900;s.connect(fl);fl.connect(g);g.connect(AC.destination);s.start();}catch(e){}}
function sfxShoot(){tone(760,0.09,'square',0.05,240);}
function sfxBoom(){noiseS(0.5,0.25,700);tone(90,0.4,'sine',0.2,40);}
function sfxPick(){tone(520,0.08,'sine',0.09);setTimeout(function(){tone(780,0.1,'sine',0.09);},70);}
function sfxUi(){tone(440,0.05,'triangle',0.06);}
function sfxJump(){tone(180,0.7,'sawtooth',0.1,900);}

/* ---------- данные ---------- */

const FACS={fed:{n:'Федерация Терра',c:'#58a6ff'},mal:{n:'Малоки',c:'#ff7043'},pel:{n:'Пеленгская Лига',c:'#66d98c'},kla:{n:'Клиссаны',c:'#b58cff'},pir:{n:'Пираты Вольницы',c:'#ff4d5e'}};

/* ---------- состояние ---------- */

const P={x:0,y:0,face:0.7,money:3000,fuel:100,maxFuel:100,missiles:6,xp:0,kills:0,

 offers:[],quests:[],shake:0,camX:0,camY:0,warpT:0,warpTo:0,warpDone:false,ev:null,evRes:null,evCool:30,spawnCool:20,flash:0,shopTab:0};

/* ---------- генерация галактики ---------- */
const SYSNAMES=['Альфа Центавра','Бета Пеленга','Гамма Малока','Дзета Кассиопеи','Тау Эридана','Сигма Ориона','Омега Лебедя','Каппа Веги','Дельта Волопаса','Тета Лиры','Эпсилон Орла','Ро Гидры','Ну Феникса','Кси Андромеды','Омикрон Пегаса','Пи Цефея','Йота Киля','Му Голубя','Лямбда Жертвенника','Тау Кита','Альфа Южного Креста','Бета Золотой Рыбы','Гамма Печи','Сигма Дракона'];
function genWorld(){
 const R=mulberry(1337);systems=[];
 const names=SYSNAMES.slice();
 for(let i=names.length-1;i>0;i--){const j=Math.floor(R()*(i+1));const t=names[i];names[i]=names[j];names[j]=t;}
 for(let i=0;i<24;i++){
  let x=0,y=0,ok=false,tries=0;
  while(!ok&&tries<300){ok=true;x=60+R()*880;y=60+R()*580;
   for(let j=0;j<systems.length;j++){if(dist(x,y,systems[j].x,systems[j].y)<120){ok=false;break;}}tries++;}
  systems.push({id:i,name:names[i],x:x,y:y,fac:pick(['fed','fed','mal','pel','kla']),danger:1+Math.floor(R()*5),
   starC:pick(['#ffd27a','#ff9a5c','#9ecbff','#fff3c4','#ff7a6e']),starR:26+R()*18,links:[],planets:[]});}
 for(let i=0;i<systems.length;i++){const s=systems[i];
  const near=systems.filter(function(o){return o!==s;}).sort(function(a,b){return dist(s.x,s.y,a.x,a.y)-dist(s.x,s.y,b.x,b.y);});
  for(let k=0;k<2;k++){const o=near[k];if(s.links.indexOf(o.id)<0)s.links.push(o.id);if(o.links.indexOf(s.id)<0)o.links.push(s.id);}}
 function comp(){const seen=new Set([0]);const st=[0];
  while(st.length){const c=st.pop();const ls=systems[c].links;
   for(let i=0;i<ls.length;i++){if(!seen.has(ls[i])){seen.add(ls[i]);st.push(ls[i]);}}}return seen;}
 let guard=0;
 while(comp().size<24&&guard<200){guard++;const seen=comp();let best=null,bd=1e9;
  for(let a=0;a<systems.length;a++)for(let b=0;b<systems.length;b++){
   if(seen.has(a)===seen.has(b))continue;
   const d=dist(systems[a].x,systems[a].y,systems[b].x,systems[b].y);
   if(d<bd){bd=d;best=[a,b];}}
  if(best){systems[best[0]].links.push(best[1]);systems[best[1]].links.push(best[0]);}else break;}
 const PN=['Терра','Нова','Вега','Хор','Зар','Мир','Тал','Ора','Кесс','Дун','Аш','Бел'];
 for(let i=0;i<systems.length;i++){const s=systems[i];
  const np=2+Math.floor(R()*3);
  for(let j=0;j<np;j++){
   const type=pick(['rock','rock','ice','lava','tech','gas']);
   s.planets.push({name:pick(PN)+pick(['а','ис','ос','ум','ея','ар','ион','ара'])+(R()<0.3?'-2':''),type:type,
    orbit:280+j*230+R()*90,size:24+R()*34,spd:(0.05+R()*0.05)/(j*0.5+1),ang:R()*TAU,
    ring:type==='gas'&&R()<0.6,econ:pick(['agr','ind','min','rich','tech','port']),
    hasPort:type!=='gas'&&R()<0.92,prices:{},stock:{},x:0,y:0});}}}
function rollPrices(pl){for(let i=0;i<GOODS.length;i++){const g=GOODS[i];const ec=ECON[pl.econ];
 const f=ec.prod.indexOf(g.id)>=0?0.55:(ec.cons.indexOf(g.id)>=0?1.5:1);
 pl.prices[g.id]=Math.max(3,Math.round(g.b*f*(0.85+Math.random()*0.3)));
 pl.stock[g.id]=ec.prod.indexOf(g.id)>=0?rndi(60,140):(ec.cons.indexOf(g.id)>=0?rndi(4,18):rndi(12,40));}}
function bfs(a,b){if(a===b)return[a];const prev={};const seen=new Set([a]);let q=[a];
 while(q.length){const c=q.shift();const ls=systems[c].links;
  for(let i=0;i<ls.length;i++){const l=ls[i];if(seen.has(l))continue;seen.add(l);prev[l]=c;q.push(l);
   if(l===b){const path=[b];let n=b;while(n!==a){n=prev[n];path.unshift(n);}return path;}}}return null;}
function planetPos(pl){return{x:Math.cos(pl.ang)*pl.orbit,y:Math.sin(pl.ang)*pl.orbit};}

/* ---------- игрок ---------- */
function applyEquip(){
 const hp=P.hull/P.maxHull,sp=P.shield/P.maxShield;
 P.maxHull=HULLS[P.eq.h].hp;P.hull=hp*P.maxHull;
 P.maxShield=SHIELDS[P.eq.s].cap;P.shield=sp*P.maxShield;P.shieldReg=SHIELDS[P.eq.s].reg;
 P.maxSpeed=ENGINES[P.eq.e].spd;
 P.cap=CARGOS[P.eq.c].cap;P.radar=RADARS[P.eq.r].r;P.weapon=WEAPONS[P.eq.w];}
function cargoUsed(){let s=0;for(const k in P.cargo)s+=P.cargo[k];return s;}
function rankName(){let r=RANKS[0][0];for(let i=0;i<RANKS.length;i++)if(P.xp>=RANKS[i][1])r=RANKS[i][0];return r;}
function addXp(v){const old=rankName();P.xp+=v;const nn=rankName();if(nn!==old){toast('🎖️ Новое звание: '+nn+'!','good');sfxPick();}}
function addRep(f,v){P.rep[f]=clamp(P.rep[f]+v,-100,100);}

/* ---------- NPC ---------- */
function tier(){return Math.min(5,Math.floor((P.xp+(systems[G.sysId]?systems[G.sysId].danger:1)*120)/400));}
function makeShip(fac,type,x,y){
 const T=tier();
 const s={uid:uidCounter++,fac:fac,type:type,x:x,y:y,ang:rnd(0,TAU),wp:null,angry:false,dead:false};
 if(type==='trader'){s.mh=60+T*20;s.dmg=4;s.rate=1.6;s.spd=120;s.size=14;s.xp=8;s.name='Торговец';}
 else if(type==='pirate'){s.mh=45+T*15;s.dmg=5+T;s.rate=2.2;s.spd=165;s.size=12;s.xp=15+T*5;s.name='Пират';}
 else if(type==='raider'){s.mh=90+T*25;s.dmg=8+T*2;s.rate=2.0;s.spd=150;s.size=17;s.xp=30+T*6;s.name='Рейдер';}
 else{s.mh=80+T*20;s.dmg=6+T;s.rate=2.4;s.spd=180;s.size=14;s.xp=20;s.name='Патруль';}
 s.hull=s.mh;return s;}
function spawnShips(S){
 G.ships=[];
 for(let i=0;i<rndi(3,4);i++){const pl=pick(S.planets);const a=rnd(0,TAU);
  G.ships.push(makeShip(pick(['fed','mal','pel','kla']),'trader',Math.cos(a)*pl.orbit+rnd(-80,80),Math.sin(a)*pl.orbit+rnd(-80,80)));}
 for(let i=0;i<S.danger+rndi(0,1);i++){const a=rnd(0,TAU),r=rnd(900,1500);
  G.ships.push(makeShip('pir',Math.random()<0.25?'raider':'pirate',Math.cos(a)*r,Math.sin(a)*r));}
 for(let i=0;i<2;i++){const a=rnd(0,TAU),r=rnd(400,900);
  G.ships.push(makeShip(S.fac,'patrol',Math.cos(a)*r,Math.sin(a)*r));}}
function hostilePair(a,b){if(a===b)return false;if(a==='pir'||b==='pir')return true;return false;}
function shipByUid(u){for(let i=0;i<G.ships.length;i++)if(G.ships[i].uid===u&&!G.ships[i].dead)return G.ships[i];return null;}
function hostileToPlayer(s){return s.fac==='pir'||P.rep[s.fac]<-15||s.angry;}
function closestHostile(x,y,rng){let best=null,bd=rng;
 for(let i=0;i<G.ships.length;i++){const s=G.ships[i];
  if(s.dead||!hostileToPlayer(s))continue;
  const d=dist(x,y,s.x,s.y);if(d<=bd){bd=d;best=s;}}
 return best;}
function enterSystem(id){
 if(!systems[id])return;
 G.sysId=id;G.moveTarget=null;G.targetShip=null;G.shotMode='laser';G.anim=null;
 makeStars();G.loot=[];G.parts=[];G.fshots=[];G.floats=[];
 spawnShips(systems[id]);
 if(P.docked===null){const a=rnd(0,TAU);P.x=Math.cos(a)*1250;P.y=Math.sin(a)*1250;}
 G.visited.add(id);G.phase='player';
 for(let i=0;i<G.quests.length;i++){const q=G.quests[i];
  if(q.t==='explore'&&q.sys===id&&!q.done)completeQuest(q);}
 save();}
function makeStars(){G.stars=[];for(let i=0;i<240;i++)G.stars.push({x:rnd(0,2400),y:rnd(0,2400),p:rnd(0.15,0.85),s:rnd(0.4,1.7),tw:rnd(0,TAU)});
 G.neb=[];for(let i=0;i<4;i++)G.neb.push({x:rnd(-1600,1600),y:rnd(-1600,1600),r:rnd(350,750),h:pick([200,280,20,320,180])});}

/* ---------- тосты ---------- */
function toast(msg,cls){try{
 const d=document.createElement('div');d.className='toast '+(cls||'');d.textContent=msg;
 $('toasts').appendChild(d);
 while($('toasts').children.length>4)$('toasts').removeChild($('toasts').firstChild);
 setTimeout(function(){d.style.opacity='0';d.style.transition='opacity .4s';setTimeout(function(){if(d.parentNode)d.parentNode.removeChild(d);},400);},3600);}catch(e){}}

/* ---------- эффекты ---------- */
function boom(x,y,size,col){
 for(let i=0;i<size;i++){const a=rnd(0,TAU),v=rnd(20,180);
  G.parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rnd(0.3,0.9),max:0.9,s:rnd(1.5,4),c:pick([col,'#ffd77a','#ff7043','#ffffff'])});}
 if(dist(x,y,P.x,P.y)<800)sfxBoom();}
function addFloater(x,y,txt,col){if(txt)G.floats.push({x:x,y:y,txt:txt,col:col,life:1.4});}
function shotFx(x0,y0,x1,y1,col){G.fshots.push({x0:x0,y0:y0,x1:x1,y1:y1,col:col,t:0,dur:0.28});
 if(dist(x1,y1,P.x,P.y)<800||dist(x0,y0,P.x,P.y)<800)sfxShoot();}
function dropLoot(s){if(Math.random()<0.65){
 if(Math.random()<0.5)G.loot.push({x:s.x,y:s.y,kind:'money',val:rndi(80,500)+tier()*60,life:99});
 else G.loot.push({x:s.x,y:s.y,kind:'good',g:pick(GOODS).id,qty:rndi(1,4),life:99});}}

/* ---------- урон ---------- */
function destroyShip(s,src){s.dead=true;boom(s.x,s.y,26,FACS[s.fac].c);dropLoot(s);
 if(src==='player'){P.kills++;addXp(s.xp);
  if(s.fac==='pir'){if(Math.random()<0.5)addRep(pick(['fed','mal','pel','kla']),1);toast('☠️ '+s.name+' уничтожен +'+s.xp+' опыта','good');}
  else{addRep(s.fac,-12);toast('⚠️ Уничтожен корабль фракции '+FACS[s.fac].n+'! Репутация −12','bad');}
  for(let i=0;i<G.quests.length;i++){const q=G.quests[i];
   if(q.t==='bounty'&&!q.done&&q.sys===G.sysId&&s.fac==='pir'){q.prog++;if(q.prog>=q.n)completeQuest(q);}}}}
function damageShip(s,dmg,src){if(!s||s.dead)return;s.hull-=dmg;addFloater(s.x,s.y-s.size-8,'-'+dmg,'#ff9aa8');
 if(src==='player'&&!s.angry){s.angry=true;if(s.fac!=='pir')addRep(s.fac,-1);}
 if(s.hull<=0)destroyShip(s,src);else sfxHit();}
function damagePlayer(dmg){
 const total=dmg;
 if(P.shield>0){const sh=Math.min(P.shield,dmg);P.shield-=sh;dmg-=sh;}
 if(dmg>0)P.hull-=dmg;
 G.flash=0.35;G.shake=Math.min(10,G.shake+4);sfxHit();
 addFloater(P.x,P.y-22,'-'+total,'#ff6a6a');
 if(P.hull<=0)die();}
function die(){boom(P.x,P.y,60,'#ffd77a');G.anim=null;G.phase='dead';G.state='dead';openDead();}

/* ---------- ПОШАГОВЫЙ БОЙ ---------- */
function clampToWorld(x,y){
 if(!isFinite(x)||!isFinite(y))return{x:0,y:0};
 const r=Math.hypot(x,y);if(r>1850){x*=1850/r;y*=1850/r;}
 const S=systems[G.sysId];
 for(let i=0;i<S.planets.length;i++){const pp=planetPos(S.planets[i]);const R0=S.planets[i].size+14;
  const d=dist(x,y,pp.x,pp.y);
  if(d<R0&&d>0.01){const a=Math.atan2(y-pp.y,x-pp.x);x=pp.x+Math.cos(a)*R0;y=pp.y+Math.sin(a)*R0;}}
 return{x:x,y:y};}
function resolvePlayerShot(){
 let missile=(G.shotMode==='missile');
 if(missile&&P.missiles<=0){missile=false;toast('Ракет нет — купите на верфи','bad');G.shotMode='laser';}
 const rng=missile?520:P.weapon.range;
 let tgt=G.targetShip?shipByUid(G.targetShip):null;
 if(tgt&&dist(P.x,P.y,tgt.x,tgt.y)>rng){toast('Цель вне дальности — ищу другую','bad');tgt=null;}
 if(!tgt)tgt=closestHostile(P.x,P.y,rng);
 if(!tgt)return; /* выстрела нет, режим ракеты сохраняется */
 G.shotMode='laser';
 shotFx(P.x,P.y,tgt.x,tgt.y,missile?'#ffb347':P.weapon.c);
 if(Math.random()<0.9){
  if(missile)P.missiles--;
  const dmg=missile?45:Math.round(P.weapon.dmg*P.weapon.rate*0.45);
  const tx=tgt.x,ty=tgt.y;
  damageShip(tgt,dmg,'player');
  if(missile){
   for(let i=0;i<G.ships.length;i++){const o=G.ships[i];
    if(o.dead||o.fac!=='pir')continue;
    if(dist(o.x,o.y,tx,ty)<90)damageShip(o,15,'player');}}
 }else{addFloater(tgt.x,tgt.y-tgt.size-8,'ПРОМАХ','#9fb8e8');}}
function execTurn(waitMode){
 if(G.state!=='game'||G.panel||G.anim||G.phase!=='player'||P.docked!==null)return;
 const S=systems[G.sysId];
 for(let i=0;i<S.planets.length;i++)S.planets[i].ang+=S.planets[i].spd*0.6;
 const movers=[];
 if(!waitMode&&G.moveTarget){
  let tx=G.moveTarget.x,ty=G.moveTarget.y;
  const d=dist(P.x,P.y,tx,ty);
  if(d>P.maxSpeed&&d>0.01){tx=P.x+(tx-P.x)*P.maxSpeed/d;ty=P.y+(ty-P.y)*P.maxSpeed/d;}
  const c=clampToWorld(tx,ty);
  if(c.x!==P.x||c.y!==P.y){
   movers.push({o:P,x0:P.x,y0:P.y,x1:c.x,y1:c.y});
   P.face=Math.atan2(c.y-P.y,c.x-P.x);
   P.x=c.x;P.y=c.y;}
  G.moveTarget=null;}
 resolvePlayerShot();
 G.ships=G.ships.filter(function(s){return !s.dead;});
 G.phase='anim';
 G.anim={t:0,dur:Math.max(0.25,movers.length?0.6:0.3),movers:movers,after:'enemy'};}
function enemyPhase(){
 if(P.hull<=0)return;
 const movers=[];
 /* выстрелы NPC (до их перемещения) */
 for(let i=0;i<G.ships.length;i++){const s=G.ships[i];
  if(s.dead||s.type==='trader')continue;
  let tgt=null,bd=NPC_RANGE;
  if(s.fac==='pir'){
   const dP=dist(s.x,s.y,P.x,P.y);
   if(dP<=NPC_RANGE){tgt={p:true};bd=dP;}
   for(let j=0;j<G.ships.length;j++){const o=G.ships[j];
    if(o===s||o.dead||o.fac==='pir')continue;
    const d=dist(s.x,s.y,o.x,o.y);if(d<bd){bd=d;tgt=o;}}}
  else{
   for(let j=0;j<G.ships.length;j++){const o=G.ships[j];
    if(o===s||o.dead||o.fac!=='pir')continue;
    const d=dist(s.x,s.y,o.x,o.y);if(d<bd){bd=d;tgt=o;}}
   if(!tgt&&(P.rep[s.fac]<-15||s.angry)){const dP=dist(s.x,s.y,P.x,P.y);if(dP<=NPC_RANGE){tgt={p:true};bd=dP;}}}
  if(tgt&&bd<=NPC_RANGE){
   const tx=tgt.p?P.x:tgt.x,ty=tgt.p?P.y:tgt.y;
   s.ang=Math.atan2(ty-s.y,tx-s.x);
   if(Math.random()<0.75){
    const dmg=Math.round(s.dmg*s.rate*0.5);
    shotFx(s.x,s.y,tx,ty,FACS[s.fac].c);
    if(tgt.p)damagePlayer(dmg);else damageShip(tgt,dmg,s.fac);
   }else{addFloater(tx,ty-18,'ПРОМАХ','#9fb8e8');}}}
 /* перемещения NPC */
 for(let i=0;i<G.ships.length;i++){const s=G.ships[i];
  if(s.dead)continue;
  let nx=s.x,ny=s.y,moved=false;
  let threatPirate=null,tpd=340;
  for(let j=0;j<G.ships.length;j++){const o=G.ships[j];
   if(o.dead||o.fac!=='pir')continue;
   const d=dist(s.x,s.y,o.x,o.y);if(d<tpd){tpd=d;threatPirate=o;}}
  if(s.type==='trader'){
   if(threatPirate){const a=Math.atan2(s.y-threatPirate.y,s.x-threatPirate.x);
    nx=s.x+Math.cos(a)*s.spd;ny=s.y+Math.sin(a)*s.spd;moved=true;s.ang=a;}
   else{
    if(s.wp===null||s.wp===undefined)s.wp=rndi(0,systems[G.sysId].planets.length-1);
    const pl=systems[G.sysId].planets[s.wp];const pp=planetPos(pl);
    const d=dist(s.x,s.y,pp.x,pp.y);
    if(d<pl.size+50){s.wp=rndi(0,systems[G.sysId].planets.length-1);}
    else if(d>1){nx=s.x+(pp.x-s.x)/d*s.spd;ny=s.y+(pp.y-s.y)/d*s.spd;moved=true;s.ang=Math.atan2(pp.y-s.y,pp.x-s.x);}}}
  else{
   let tgt=null,bd=820;
   if(s.fac==='pir'){
    const dP=dist(s.x,s.y,P.x,P.y);if(dP<bd){bd=dP;tgt={p:true};}
    for(let j=0;j<G.ships.length;j++){const o=G.ships[j];
     if(o===s||o.dead||o.fac==='pir')continue;
     const d=dist(s.x,s.y,o.x,o.y);if(d<bd){bd=d;tgt=o;}}}
   else{
    for(let j=0;j<G.ships.length;j++){const o=G.ships[j];
     if(o===s||o.dead||o.fac!=='pir')continue;
     const d=dist(s.x,s.y,o.x,o.y);if(d<bd){bd=d;tgt=o;}}
    if(!tgt&&(P.rep[s.fac]<-15||s.angry)){const dP=dist(s.x,s.y,P.x,P.y);if(dP<bd){bd=dP;tgt={p:true};}}}
   if(tgt){const tx=tgt.p?P.x:tgt.x,ty=tgt.p?P.y:tgt.y;
    const d=dist(s.x,s.y,tx,ty);
    s.ang=Math.atan2(ty-s.y,tx-s.x);
    if(d>NPC_RANGE*0.75&&d>1){nx=s.x+(tx-s.x)/d*s.spd;ny=s.y+(ty-s.y)/d*s.spd;moved=true;}}
   else{
    if(!s.wp||dist(s.x,s.y,s.wp.x,s.wp.y)<60){const a=rnd(0,TAU),r=rnd(300,1400);s.wp={x:Math.cos(a)*r,y:Math.sin(a)*r};}
    const d=dist(s.x,s.y,s.wp.x,s.wp.y);
    if(d>1){nx=s.x+(s.wp.x-s.x)/d*s.spd;ny=s.y+(s.wp.y-s.y)/d*s.spd;moved=true;s.ang=Math.atan2(s.wp.y-s.y,s.wp.x-s.x);}}}
  if(moved){const c=clampToWorld(nx,ny);
   if(c.x!==s.x||c.y!==s.y){movers.push({o:s,x0:s.x,y0:s.y,x1:c.x,y1:c.y});s.x=c.x;s.y=c.y;}}}
 G.ships=G.ships.filter(function(s){return !s.dead;});
 if(P.hull<=0)return;
 G.anim={t:0,dur:movers.length?0.7:0.35,movers:movers,after:'end'};}
function endTurn(){
 G.turn++;
 if(G.turn%DAY_TURNS===1&&G.turn>1){
  G.day++;
  for(let i=0;i<G.quests.length;i++){const q=G.quests[i];
   if(!q.done&&G.day>q.deadline){q.done=true;q.failed=true;
    toast('⌛ Задание провалено: '+questTitle(q),'bad');
    if(q.t==='del')P.cargo[q.g]=Math.max(0,(P.cargo[q.g]||0)-q.q);}}}
 G.quests=G.quests.filter(function(q){return !q.done&&!q.failed;});
 P.shield=Math.min(P.maxShield,P.shield+P.shieldReg);
 for(let i=0;i<G.loot.length;i++){const l=G.loot[i];

function questTitle(q){
 if(q.t==='del')return 'Доставка: '+goodById(q.g).n+' → '+systems[q.sys].name;
 if(q.t==='bounty')return 'Охота на пиратов: '+systems[q.sys].name;
 return 'Разведка: '+systems[q.sys].name;}
function genOffers(){
 G.offers=[];const cur=G.sysId;
 for(let i=0;i<3;i++){const r=Math.random();
  if(r<0.5){
   const g=pick(GOODS),q=rndi(4,14);
   const cands=systems.filter(function(s){return s.id!==cur&&bfs(cur,s.id)&&bfs(cur,s.id).length<=4;});
   if(!cands.length)continue;
   const ts=pick(cands);const tp=ts.planets.filter(function(p){return p.hasPort;});
   if(!tp.length)continue;
   const pl=bfs(cur,ts.id).length;
   G.offers.push({t:'del',g:g.id,q:q,sys:ts.id,pl:ts.planets.indexOf(tp[0]),
    reward:Math.round(q*g.b*(1.2+pl*0.55)),deadline:Math.ceil(G.day+pl*1.5+3)});
  }else if(r<0.8){
   const sys=Math.random()<0.6?cur:pick(systems[cur].links);
   const n=rndi(2,4);
   G.offers.push({t:'bounty',sys:sys,n:n,prog:0,reward:n*550+systems[sys].danger*250,deadline:Math.ceil(G.day+5)});
  }else{
   const cands=systems.filter(function(s){return s.id!==cur&&!G.visited.has(s.id)&&bfs(cur,s.id)&&bfs(cur,s.id).length<=3;});
   let ts;
   if(cands.length)ts=pick(cands);
   else{const ns=systems[cur].links;if(!ns.length)continue;ts=systems[pick(ns)];}
   const path=bfs(cur,ts.id);if(!path)continue;
   G.offers.push({t:'explore',sys:ts.id,reward:1000+path.length*500,deadline:Math.ceil(G.day+7)});}}}
function completeQuest(q){q.done=true;P.money+=q.reward;addXp(Math.round(q.reward/10));addRep('fed',2);
 toast('✅ Задание выполнено: +'+fmt(q.reward)+' кр.','good');sfxPick();}
function accQ(i){const o=G.offers[i];if(!o)return;
 if(o.t==='del'){if(P.cap-cargoUsed()<o.q){toast('Недостаточно места в трюме!','bad');return;}
  P.cargo[o.g]=(P.cargo[o.g]||0)+o.q;}
 o.done=false;G.quests.push(o);G.offers.splice(i,1);sfxUi();openPanel('quests');}
function abQ(i){const q=G.quests[i];if(!q)return;
 if(q.t==='del')P.cargo[q.g]=Math.max(0,(P.cargo[q.g]||0)-q.q);
 G.quests.splice(i,1);sfxUi();openPanel('quests');}

/* ---------- торговля / магазин ---------- */
function tradeB(id,q){const pl=curPlanet();if(!pl)return;const pr=pl.prices[id];
 const qty=Math.min(q===999?999:q,pl.stock[id],Math.floor(P.money/pr),P.cap-cargoUsed());
 if(qty<=0){toast('Не хватает денег или места','bad');return;}
 P.money-=qty*pr;P.cargo[id]=(P.cargo[id]||0)+qty;pl.stock[id]-=qty;
 pl.prices[id]=Math.round(pr*(1+qty*0.004));sfxUi();renderPanel();}
function tradeS(id,q){const pl=curPlanet();if(!pl)return;const own=P.cargo[id]||0;
 const qty=Math.min(q===999?999:q,own);if(qty<=0)return;
 P.money+=qty*pl.prices[id];P.cargo[id]-=qty;pl.stock[id]+=qty;
 pl.prices[id]=Math.max(3,Math.round(pl.prices[id]*(1-qty*0.004)));sfxUi();renderPanel();}
function shopTab(i){G.shopTab=i;sfxUi();renderPanel();}
function shopBuy(catIdx,idx){const cat=SHOPCATS[catIdx];const cur=P.eq[cat.key];
 const net=cat.arr[idx].p-Math.floor(cat.arr[cur].p*0.4);
 if(P.money<net){toast('Не хватает денег','bad');return;}
 P.money-=net;P.eq[cat.key]=idx;applyEquip();sfxPick();toast('🔧 Установлено: '+cat.arr[idx].n,'good');renderPanel();}
function buyMis(){if(P.money<500){toast('Не хватает денег','bad');return;}P.money-=500;P.missiles+=4;sfxPick();renderPanel();}

/* ---------- порт ---------- */
function nearPlanet(){if(P.docked!==null)return null;const S=systems[G.sysId];
 for(let i=0;i<S.planets.length;i++){const pl=S.planets[i];if(!pl.hasPort)continue;const pp=planetPos(pl);
  if(dist(P.x,P.y,pp.x,pp.y)<pl.size+80)return i;}
 return null;}
function uiDockAct(a){
 if(a==='trade'){sfxUi();openPanel('trade');}
 else if(a==='shop'){G.shopTab=0;sfxUi();openPanel('shop');}
 else if(a==='quests'){if(!G.offers.length)genOffers();sfxUi();openPanel('quests');}
 else if(a==='repair'){const c=Math.ceil((P.maxHull-P.hull)*1.6);
  if(P.money>=c&&P.hull<P.maxHull){P.money-=c;P.hull=P.maxHull;toast('🛠️ Корпус отремонтирован','good');sfxPick();}renderPanel();}
 else if(a==='refuel'){const c=Math.ceil((P.maxFuel-P.fuel)*2);
  if(P.money>=c){P.money-=c;P.fuel=P.maxFuel;toast('⛽ Бак полон','good');sfxPick();}renderPanel();}
 else if(a==='bar'){triggerEvent();}
 else if(a==='leave'){undock();}}
function dockPlanet(idx){
 if(G.anim)return;
 const S=systems[G.sysId];
 if(!S.planets[idx])return;
 P.docked=idx;P.lastPort={sys:G.sysId,pl:idx};
 rollPrices(S.planets[idx]);G.offers=[];G.moveTarget=null;G.targetShip=null;
 /* доставка */
 for(let i=0;i<G.quests.length;i++){const q=G.quests[i];
  if(q.t==='del'&&!q.done&&q.sys===G.sysId&&q.pl===idx){
   P.cargo[q.g]=Math.max(0,(P.cargo[q.g]||0)-q.q);
   completeQuest(q);}}
 openPanel('dock');save();}
function undock(){const S=systems[G.sysId],pl=S.planets[P.docked];
 if(!pl){P.docked=null;closePanel();return;}
 const pp=planetPos(pl);const a=rnd(0,TAU);
 P.x=pp.x+Math.cos(a)*(pl.size+52);P.y=pp.y+Math.sin(a)*(pl.size+52);P.face=a;
 P.docked=null;closePanel();G.phase='player';sfxUi();}

/* ---------- галактика ---------- */
function openGalaxy(){if(G.state!=='game'||G.panel||G.anim||P.docked!==null)return;G.state='galaxy';$('galClose').classList.remove('hidden');sfxUi();}
function closeGalaxy(){if(G.state==='galaxy'){G.state='game';$('galClose').classList.add('hidden');}}
function galLayout(){let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;
 for(let i=0;i<systems.length;i++){const s=systems[i];
  mnx=Math.min(mnx,s.x);mxx=Math.max(mxx,s.x);mny=Math.min(mny,s.y);mxy=Math.max(mxy,s.y);}
 const sc=Math.min((W-120)/((mxx-mnx)||1),(H-220)/((mxy-mny)||1));
 const ox=(W-(mxx-mnx)*sc)/2,oy=(H-(mxy-mny)*sc)/2-20;
 return{s:sc,fn:function(s){return[ox+(s.x-mnx)*sc,oy+(s.y-mny)*sc];}};}
function uiJump(id){const S=systems[G.sysId],T=systems[id];
 if(!T)return;
 if(S.links.indexOf(id)<0){toast('Нет прямого гиперперехода','bad');return;}
 const cost=Math.round(dist(S.x,S.y,T.x,T.y)/60+4);
 if(P.fuel<cost){toast('⛽ Мало топлива: нужно '+cost,'bad');return;}
 P.fuel-=cost;closeGalaxy();G.state='warp';G.warpT=0;G.warpDone=false;G.warpTo=id;sfxJump();}

  day:G.day,turn:G.turn,sysId:G.sysId,visited:Array.from(G.visited),quests:G.quests.filter(function(q){return !q.done;})};
 lsSet('sr3save',JSON.stringify(data));
 if(manual)toast('💾 Сохранено','good');}catch(e){}}

 if(!d||!d.P)return;
 P.money=d.P.money;P.fuel=d.P.fuel;P.missiles=d.P.missiles;P.xp=d.P.xp;P.kills=d.P.kills;
 P.eq=d.P.eq;P.cargo=d.P.cargo;P.rep=d.P.rep;P.lastPort=d.P.lastPort;
 G.day=d.day||1;G.turn=d.turn||1;G.quests=d.quests||[];G.visited=new Set(d.visited||[0]);

  else if(G.moveTarget){ra=Math.atan2(G.moveTarget.y-P.y,G.moveTarget.x-P.x);}
  ctx.save();ctx.translate(px,py);ctx.rotate(ra);
  if(P.shield>0&&P.shield<P.maxShield*0.99){ctx.strokeStyle='rgba(125,224,255,'+(0.25+0.2*Math.sin(G.t*6)).toFixed(2)+')';
   ctx.beginPath();ctx.arc(0,0,18,0,TAU);ctx.stroke();}
  ctx.fillStyle='#ffd77a';ctx.strokeStyle='#7a3a10';ctx.lineWidth=1.5;
  ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-6,-9);ctx.lineTo(-11,0);ctx.lineTo(-6,9);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#7de0ff';ctx.beginPath();ctx.arc(4,0,3,0,TAU);ctx.fill();
  ctx.restore();}
 /* трассеры */
 for(let i=0;i<G.fshots.length;i++){const f=G.fshots[i];
  const e=Math.min(1,f.t/f.dur);
  const hx=f.x0+(f.x1-f.x0)*e,hy=f.y0+(f.y1-f.y0)*e;
  ctx.strokeStyle=f.col;ctx.lineWidth=2.5;ctx.shadowColor=f.col;ctx.shadowBlur=8;
  ctx.beginPath();ctx.moveTo(hx-(f.x1-f.x0)*0.12,hy-(f.y1-f.y0)*0.12);ctx.lineTo(hx,hy);ctx.stroke();
  ctx.shadowBlur=0;ctx.lineWidth=1;}
 for(let i=0;i<G.parts.length;i++){const p=G.parts[i];
  ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.c;
  ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,TAU);ctx.fill();}
 ctx.globalAlpha=1;
 for(let i=0;i<G.floats.length;i++){const f=G.floats[i];
  if(!f.txt)continue;
  ctx.globalAlpha=Math.min(1,Math.max(0,f.life));ctx.fillStyle=f.col;ctx.font='bold 13px "Exo 2"';ctx.textAlign='center';
  ctx.fillText(f.txt,f.x,f.y-(1.4-f.life)*24);}
 ctx.globalAlpha=1;
 if(P.docked===null&&G.phase==='player'&&!G.panel){const np=nearPlanet();
  if(np!==null){const pl=S.planets[np];const pp=planetPos(pl);
   ctx.strokeStyle='rgba(120,255,180,'+(0.5+0.4*Math.sin(G.t*5)).toFixed(2)+')';
   ctx.setLineDash([6,6]);ctx.beginPath();ctx.arc(pp.x,pp.y,pl.size+22,0,TAU);ctx.stroke();ctx.setLineDash([]);}}
 ctx.restore();
 if(G.state==='warp'){const t=G.warpT;
  ctx.fillStyle='rgba(2,4,12,'+clamp(t*1.2,0,0.85).toFixed(2)+')';ctx.fillRect(0,0,W,H);
  for(let i=0;i<70;i++){const a=i/70*TAU;const r1=(t*900+i*13)%(Math.max(W,H));
   ctx.strokeStyle='hsla('+((i*37)%360)+',80%,70%,.7)';ctx.lineWidth=2;
   ctx.beginPath();ctx.moveTo(W/2+Math.cos(a)*r1,H/2+Math.sin(a)*r1);
   ctx.lineTo(W/2+Math.cos(a)*(r1+60+t*300),H/2+Math.sin(a)*(r1+60+t*300));ctx.stroke();}
  ctx.lineWidth=1;
  ctx.fillStyle='#ffd77a';ctx.font='20px "Russo One"';ctx.textAlign='center';
  ctx.fillText('ГИПЕРПЕРЕХОД…',W/2,H/2);}
 if(G.flash>0){ctx.fillStyle='rgba(255,60,60,'+(G.flash*0.35).toFixed(2)+')';ctx.fillRect(0,0,W,H);}
 if(P.hull>0&&P.hull<P.maxHull*0.25){ctx.strokeStyle='rgba(255,60,60,'+(0.3+0.3*Math.sin(G.t*6)).toFixed(2)+')';
  ctx.lineWidth=6;ctx.strokeRect(3,3,W-6,H-6);ctx.lineWidth=1;}}
function renderMM(){
 mctx.clearRect(0,0,264,264);mctx.save();mctx.translate(132,132);
 const k=120/P.radar;const S=systems[G.sysId];
 mctx.strokeStyle='rgba(120,160,255,.25)';mctx.beginPath();mctx.arc(0,0,124,0,TAU);mctx.stroke();
 for(let i=0;i<S.planets.length;i++){const pl=S.planets[i];const pp=planetPos(pl);
  const x=(pp.x-P.x)*k,y=(pp.y-P.y)*k;if(Math.hypot(x,y)>124)continue;
  mctx.fillStyle='#7de0ff';mctx.beginPath();mctx.arc(x,y,Math.max(2,pl.size*k*3),0,TAU);mctx.fill();}
 for(let i=0;i<G.ships.length;i++){const s=G.ships[i];
  const x=(s.x-P.x)*k,y=(s.y-P.y)*k;if(Math.hypot(x,y)>124)continue;
  mctx.fillStyle=hostileToPlayer(s)?'#ff4d5e':'#66d98c';mctx.beginPath();mctx.arc(x,y,3,0,TAU);mctx.fill();}
 mctx.save();mctx.rotate(P.face);mctx.fillStyle='#ffd77a';
 mctx.beginPath();mctx.moveTo(7,0);mctx.lineTo(-5,-5);mctx.lineTo(-5,5);mctx.closePath();mctx.fill();mctx.restore();
 mctx.restore();}
function updHUD(){
 const S=systems[G.sysId];
 $('sysName').textContent='⬢ '+S.name;
 $('dayRank').textContent='Ход '+G.turn+' · День '+G.day+' · '+rankName();
 $('barHull').style.width=Math.max(0,P.hull/P.maxHull*100)+'%';
 $('barShield').style.width=Math.max(0,P.shield/P.maxShield*100)+'%';
 $('res').innerHTML='💰 <b>'+fmt(P.money)+'</b> ⛽ <b>'+Math.round(P.fuel)+'</b> 📦 <b>'+cargoUsed()+'/'+P.cap+'</b> 🚀 <b>'+P.missiles+'</b>';
 let ph='—';
 if(G.state==='game'){
  if(G.panel)ph='…';
  else if(G.phase==='player'&&P.docked===null)ph=G.shotMode==='missile'?'🚀 РАКЕТНЫЙ ЗАЛП — ВАШ ХОД':'⚡ ВАШ ХОД — тап: курс/цель';
  else if(G.phase==='anim')ph='⏳ Противник действует…';
  else if(P.docked!==null)ph='🪐 Вы в порту';}
 $('phase').textContent=ph;
 let ql='';
 for(let i=0;i<G.quests.length;i++){const q=G.quests[i];if(q.done)continue;
  ql+='<div>'+(q.t==='del'?'📦':q.t==='bounty'?'☠️':'🧭')+' '+questTitle(q)+(q.t==='bounty'?' '+q.prog+'/'+q.n:'')+' · ⏳'+Math.max(0,Math.ceil(q.deadline-G.day))+'д</div>';}
 $('questLog').innerHTML=ql;
 let cb='';
 if(canCommand()){
  const np=nearPlanet();
  if(np!==null)cb+='<button onclick="dockPlanet('+np+')">⬇ Сесть: '+S.planets[np].name+'</button>';
  cb+='<button onclick="openGalaxy()">🗺 Гиперкарта (M)</button>';
  if(G.moveTarget||G.targetShip)cb+='<button onclick="clearOrders()">✕ Отмена</button>';}
 $('ctx').innerHTML=cb;
 const act=canCommand();
 $('bTurn').disabled=!act;$('bWait').disabled=!act;
 $('bMis').style.borderColor=G.shotMode==='missile'?'#ffb347':'#3d5a8f';}

/* ---------- цикл ---------- */
let last=0;
function frame(ts){
 requestAnimationFrame(frame);
 try{
  const dt=Math.min(0.05,(ts-last)/1000||0.016);last=ts;
  G.t+=dt;
  for(let i=0;i<G.parts.length;i++){const p=G.parts[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=0.96;p.vy*=0.96;p.life-=dt;}
  G.parts=G.parts.filter(function(p){return p.life>0;});
  if(G.parts.length>350)G.parts.splice(0,G.parts.length-350);
  for(let i=0;i<G.fshots.length;i++)G.fshots[i].t+=dt;
  G.fshots=G.fshots.filter(function(f){return f.t<f.dur+0.1;});
  for(let i=0;i<G.floats.length;i++)G.floats[i].life-=dt;
  G.floats=G.floats.filter(function(f){return f.life>0;});
  G.shake=Math.max(0,G.shake-dt*14);G.flash=Math.max(0,G.flash-dt);
  if(G.anim){
   G.anim.t+=dt;
   const e=easeIO(clamp(G.anim.t/G.anim.dur,0,1));
   for(let i=0;i<G.anim.movers.length;i++){const m=G.anim.movers[i];
    if(!m.o||m.o.dead)continue;
    m.o.x=m.x0+(m.x1-m.x0)*e;m.o.y=m.y0+(m.y1-m.y0)*e;}
   if(G.anim.t>=G.anim.dur){
    for(let i=0;i<G.anim.movers.length;i++){const m=G.anim.movers[i];
     if(m.o&&!m.o.dead){m.o.x=m.x1;m.o.y=m.y1;}}
    const after=G.anim.after;G.anim=null;
    if(after==='enemy'&&G.state==='game'&&G.phase==='anim'){
     enemyPhase();
     if(G.anim===null&&G.phase==='anim'&&P.hull>0)endTurn();}
    else if(after==='end'&&G.state==='game'){endTurn();}}}
  if(G.state==='warp'){G.warpT+=dt;
   if(G.warpT>0.9&&!G.warpDone){G.warpDone=true;P.docked=null;enterSystem(G.warpTo);}
   if(G.warpT>1.8){G.state='game';G.evCool=20;if(Math.random()<0.25&&!G.panel)triggerEvent();}}
  if(G.state!=='menu'){
   G.camX+=(P.x-G.camX)*Math.min(1,dt*5);G.camY+=(P.y-G.camY)*Math.min(1,dt*5);
   render();
   if(G.state==='game'||G.state==='dead'){renderMM();updHUD();}}
  $('rotHint').classList.toggle('hidden',!(innerHeight>innerWidth&&('ontouchstart' in window)&&G.state==='game'));
  $('contBtn').style.display=hasSave()?'':'none';
 }catch(e){showErr(e.message);}}
genWorld();applyEquip();P.hull=P.maxHull;P.shield=P.maxShield;
requestAnimationFrame(frame);
</script>
